# GitHub Actions - 自动构建安卓 APK
# 必维摸金单机版

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Godot
      uses: chickensoft-games/setup-godot@v1
      with:
        version: 4.2.2
        use-dotnet: false

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Keystore
      run: |
        mkdir -p ~/.android
        # 生成调试密钥库
        keytool -keyalg RSA -genkeypair -alias androiddebugkey \
          -keypass android -keystore ~/.android/debug.keystore \
          -storepass android -dname "CN=Android Debug,O=Android,C=US" \
          -validity 9999

    - name: Download Godot Android Export Templates
      run: |
        mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
        cd ~/.local/share/godot/export_templates/4.2.2.stable
        # 下载并解压导出模板
        wget -q https://downloads.tuxfamily.org/godotengine/4.2.2/Godot_v4.2.2-stable_export_templates.tpz
        unzip -o Godot_v4.2.2-stable_export_templates.tpz 2>/dev/null || true
        # tpz文件其实就是zip格式
        mv templates/* . 2>/dev/null || true

    - name: Build Android APK
      run: |
        mkdir -p build/android
        # 使用Godot命令行导出APK
        godot --headless --path . --export-release "Android" build/android/biwei_treasure_hunt.apk
        # 如果导出失败，尝试调试模式
        if [ ! -f "build/android/biwei_treasure_hunt.apk" ]; then
          echo "尝试使用调试模式导出..."
          godot --headless --path . --export-debug "Android" build/android/biwei_treasure_hunt.apk
        fi

    - name: Verify Build
      run: |
        ls -la build/android/
        if [ -f "build/android/biwei_treasure_hunt.apk" ]; then
          echo "✅ APK构建成功！"
          ls -lh build/android/biwei_treasure_hunt.apk
        else
          echo "❌ APK构建失败"
          exit 1
        fi

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: biwei-treasure-hunt-apk
        path: build/android/*.apk
        if-no-files-found: error

    - name: Summary
      run: |
        echo "===== 必维摸金 构建完成 ====="
        echo "项目: 必维摸金"
        echo "版本: v0.1.0 单机测试版"
        echo "状态: ✅ 构建成功"
        echo "============================"
